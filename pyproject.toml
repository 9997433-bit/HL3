[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hl3"
version = "0.0.1.dev0"
description = "HL3 -- open-core digital image correlation toolkit (CPU reference kernels)"
readme = "README.md"
requires-python = ">=3.10"
# ADR-LIC-001 执行规则 2：包元数据必须声明 Apache-2.0。
# 待最低 setuptools 提升到 77 后改用 PEP 639 的 license = "Apache-2.0"。
license = { text = "Apache-2.0" }
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "License :: OSI Approved :: Apache Software License",
  "Intended Audience :: Science/Research",
  "Topic :: Scientific/Engineering",
]
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
test = ["pytest>=7"]
# hl3.io.hdf5_schema 的常量与位域不需要 h5py；只有读写 .hl3 容器时需要。
hdf5 = ["h5py>=3.8"]
# 规范的 @hash_algo 是 blake3-256；缺失时降级为 blake2b-256 并如实记录。
hash = ["blake3>=0.3"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
pythonpath = ["src"]
