name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cpu-tests:
    name: Python CPU-only tests
    runs-on: ubuntu-latest
    env:
      CUDA_VISIBLE_DEVICES: ""
      HL3_CI_CPU_ONLY: "1"
      PYTHONPATH: ${{ github.workspace }}/src
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test dependencies
        run: python -m pip install --upgrade numpy pytest

      - name: Run unit tests
        run: python -m pytest -q tests src/tests
